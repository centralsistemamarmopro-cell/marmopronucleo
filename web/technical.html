<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MarmoPro — Análise Técnica</title><body style="font-family:system-ui;max-width:900px;margin:40px auto;padding:20px"><h1>Análise Técnica</h1><p>Envie o projeto para iniciar a conferência técnica.</p><input id="file" type="file" accept="application/pdf,image/*"><button id="go">Preparar análise</button><pre id="out"></pre><script>const out=document.querySelector('#out');document.querySelector('#go').onclick=async()=>{const f=document.querySelector('#file').files[0];if(!f){out.textContent='Selecione um PDF ou imagem.';return}out.textContent=`Arquivo recebido: ${f.name}\nTamanho: ${Math.round(f.size/1024)} KB\n\nPróxima etapa: processamento técnico.`};</script></body></html>
