<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MarmoPro — Planos</title><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f5f5f5;color:#222}main{max-width:1180px;margin:auto;padding:32px}header{display:flex;justify-content:space-between;align-items:center;gap:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin:24px 0}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:20px;box-shadow:0 2px 8px #0000000a}.value{font-size:32px;font-weight:700}.price{font-size:28px;font-weight:700;margin:14px 0}button{border:0;border-radius:9px;padding:11px 15px;cursor:pointer;background:#111;color:#fff}.secondary{background:#e8e8e8;color:#111}input{width:100%;padding:11px;box-sizing:border-box;border:1px solid #ccc;border-radius:8px;margin:6px 0 12px}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:20px}.modal .card{width:min(440px,100%)}.chat{display:grid;grid-template-columns:1fr auto;gap:10px}textarea{width:100%;min-height:90px;padding:10px;box-sizing:border-box}@media(max-width:600px){main{padding:18px}}
</style></head>
<body><main><header><div><h1>MarmoPro</h1><p>Escolha o nível de operação da sua marmoraria.</p></div><button class="secondary" onclick="refresh()">Atualizar</button></header>
<section class="grid" id="plans"></section><section class="grid" id="stats"></section>
<div class="card"><h2>Chatbot / Agente humanizado</h2><div id="messages"></div><div class="chat"><textarea id="input" placeholder="Digite uma mensagem..."></textarea><button onclick="send()">Enviar</button></div></div>
</main>
<div class="modal" id="modal"><div class="card"><h2>Ativar MarmoPro</h2><p id="selected"></p><label>Nome da marmoraria</label><input id="company" placeholder="Ex.: Marmoraria Silva"><label>E-mail do responsável</label><input id="email" type="email" placeholder="voce@empresa.com"><button onclick="checkout()">Continuar para pagamento</button> <button class="secondary" onclick="closeModal()">Cancelar</button><p id="checkoutError"></p></div></div>
<script>
let selectedPlan=null;
async function refresh(){const [plans,d]=await Promise.all([fetch('/api/plans').then(r=>r.json()),fetch('/api/dashboard').then(r=>r.json())]);document.getElementById('plans').innerHTML=plans.map(p=>`<div class="card"><h2>${escapeHtml(p.name)}</h2><p>${escapeHtml(p.description)}</p>${Number(p.monthly_price_brl)?`<div class="price">R$ ${Number(p.monthly_price_brl).toFixed(2).replace('.',',')}<small>/mês</small></div><p>Implantação: R$ ${Number(p.setup_price_brl).toFixed(2).replace('.',',')}</p><button onclick="openCheckout('${escapeAttr(p.key)}','${escapeAttr(p.name)}')">Escolher plano</button>`:'<p>Personalizado</p><button onclick="alert(\'Plano Custom: a contratação será feita após análise comercial.\')">Solicitar proposta</button>'}</div>`).join('');document.getElementById('stats').innerHTML=Object.entries(d).map(([k,v])=>`<div class="card"><div>${escapeHtml(k)}</div><div class="value">${v}</div></div>`).join('')}
function openCheckout(key,name){selectedPlan=key;document.getElementById('selected').textContent=`Plano selecionado: ${name}`;document.getElementById('modal').style.display='flex'}
function closeModal(){document.getElementById('modal').style.display='none'}
async function checkout(){const company=document.getElementById('company').value.trim(),email=document.getElementById('email').value.trim();if(!company||!email){document.getElementById('checkoutError').textContent='Informe empresa e e-mail.';return}const r=await fetch('/api/billing/checkout',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({planKey:selectedPlan,companyName:company,email})});const d=await r.json();if(!r.ok){document.getElementById('checkoutError').textContent=d.error||'Não foi possível iniciar o pagamento.';return}location.href=d.checkoutUrl}
async function send(){const el=document.getElementById('input'),text=el.value.trim();if(!text)return;document.getElementById('messages').innerHTML+=`<p><b>Você:</b> ${escapeHtml(text)}</p>`;el.value='';const r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:text})});const d=await r.json();document.getElementById('messages').innerHTML+=`<p><b>MarmoPro:</b> ${escapeHtml(d.text||d.error)}</p>`}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escapeAttr(s){return String(s).replace(/['\\]/g,'')}
refresh();
</script></body></html>
