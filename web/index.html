<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MarmoPro Núcleo</title><style>body{font-family:system-ui;margin:0;background:#f5f5f5;color:#222}main{max-width:1100px;margin:auto;padding:32px}header{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin:24px 0}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:20px}.value{font-size:32px;font-weight:700}button{border:0;border-radius:8px;padding:10px 14px;cursor:pointer}textarea{width:100%;min-height:90px;padding:10px;box-sizing:border-box}.chat{display:grid;grid-template-columns:1fr auto;gap:10px}@media(max-width:600px){main{padding:18px}}</style></head>
<body><main><header><div><h1>MarmoPro Núcleo</h1><p>Operação, marketing, suporte e agentes.</p></div><button onclick="refresh()">Atualizar</button></header>
<section class="grid" id="stats"></section>
<div class="card"><h2>Chatbot / Agente humanizado</h2><div id="messages"></div><div class="chat"><textarea id="input" placeholder="Digite uma mensagem..."></textarea><button onclick="send()">Enviar</button></div></div>
<script>
async function refresh(){const d=await fetch('/api/dashboard').then(r=>r.json());document.getElementById('stats').innerHTML=Object.entries(d).map(([k,v])=>`<div class="card"><div>${k}</div><div class="value">${v}</div></div>`).join('')}
async function send(){const el=document.getElementById('input'), text=el.value.trim();if(!text)return;document.getElementById('messages').innerHTML+=`<p><b>Você:</b> ${escapeHtml(text)}</p>`;el.value='';const r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:text})});const d=await r.json();document.getElementById('messages').innerHTML+=`<p><b>MarmoPro:</b> ${escapeHtml(d.text||d.error)}</p>`}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}refresh();
</script></main></body></html>
